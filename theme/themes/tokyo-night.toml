# Tokyo Night (Night variant): https://github.com/folke/tokyonight.nvim
# Every value is from the official palette; comments give its tokyonight.nvim name.
name = "Tokyo Night"

[official]
ghostty = "TokyoNight Night"
zed = "Tokyo Night"
zed_extension = "tokyo-night"
vscode = "Tokyo Night"
vscode_extension = "enkia.tokyo-night"
obsidian = "Tokyo Night"
obsidian_repo = "tcmmichaelb139/obsidian-tokyonight"

[colors]
base = "#1a1b26"       # bg
mantle = "#16161e"     # bg_dark
crust = "#0c0e14"      # bg_dark1
surface0 = "#292e42"   # bg_highlight
surface1 = "#3b4261"   # fg_gutter
surface2 = "#414868"   # terminal_black
overlay0 = "#565f89"   # comment
overlay1 = "#737aa2"   # dark5
overlay2 = "#a9b1d6"   # fg_dark
subtext0 = "#a9b1d6"   # fg_dark
subtext1 = "#a9b1d6"   # fg_dark
text = "#c0caf5"       # fg
rosewater = "#c0caf5"  # fg (Tokyo Night has no rosewater; its cursor is fg)
flamingo = "#f7768e"   # red
pink = "#ff007c"       # magenta2
mauve = "#bb9af7"      # magenta
red = "#f7768e"        # red
maroon = "#db4b4b"     # red1
peach = "#ff9e64"      # orange
yellow = "#e0af68"     # yellow
green = "#9ece6a"      # green
teal = "#73daca"       # green1
sky = "#7dcfff"        # cyan
sapphire = "#2ac3de"   # blue1
blue = "#7aa2f7"       # blue
lavender = "#9d7cd8"   # purple
